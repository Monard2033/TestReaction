<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171f"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark high-tech rounded container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="#38bdf8" stroke-width="2.2" stroke-opacity="0.8"/>

  <!-- Radar/Crosshair reticle rings -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-opacity="0.45"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.5"/>

  <!-- Crosshair tick marks -->
  <line x1="32" y1="5" x2="32" y2="15" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="32" y1="49" x2="32" y2="59" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="5" y1="32" x2="15" y2="32" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="49" y1="32" x2="59" y2="32" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Glowing Lightning Bolt / Instant Reflex Stimulus -->
  <path d="M35 11 L21 33 L31 33 L27 53 L43 27 L33 27 Z" fill="url(#bolt)" filter="url(#glow)"/>
  
  <!-- Central Precision Aim Point -->
  <circle cx="32" cy="32" r="2.2" fill="#0a0c10" stroke="#86efac" stroke-width="1.2"/>
</svg>
